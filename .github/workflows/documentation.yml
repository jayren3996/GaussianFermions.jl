name: Documentation

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

# `deploydocs` pushes the built site to the `gh-pages` branch, so the job
# only needs write access to repository contents.
permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # used by deploydocs to push to gh-pages
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # optional: SSH deploy key, enables PR previews
        run: julia --color=yes --project=docs docs/make.jl
